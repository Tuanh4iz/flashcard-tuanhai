<!DOCTYPE html>
<html lang="vi" data-bs-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🎮 Ghép cặp từ vựng</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        :root {
            --bg-primary: #f0f2f5;
            --bg-card: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: #6c757d;
            --shadow: 0 2px 12px rgba(0,0,0,0.06);
            --shadow-hover: 0 6px 24px rgba(0,0,0,0.12);
            --radius: 16px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --nav-bg: rgba(255,255,255,0.85);
            --border-color: rgba(0,0,0,0.06);
            --success: #28a745;
            --danger: #dc3545;
            --primary: #6c63ff;
        }
        [data-bs-theme="dark"] {
            --bg-primary: #12121e;
            --bg-card: #1e1e3a;
            --text-primary: #f1f1f1;
            --text-secondary: #8a8aa8;
            --shadow: 0 2px 12px rgba(0,0,0,0.3);
            --shadow-hover: 0 6px 24px rgba(0,0,0,0.5);
            --nav-bg: rgba(20,20,40,0.9);
            --border-color: rgba(255,255,255,0.06);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg-primary);
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: var(--text-primary);
            transition: background var(--transition), color var(--transition);
            min-height: 100vh;
            padding-bottom: 80px;
        }
        .game-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0.8rem 1rem 1.5rem;
        }
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding: 0.3rem 0;
        }
        .game-header h1 {
            font-size: 1.3rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .game-header h1 i {
            color: var(--primary);
        }
        .game-stats {
            display: flex;
            gap: 0.8rem;
            font-size: 0.85rem;
            background: var(--bg-card);
            padding: 0.3rem 1rem;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            align-items: center;
        }
        .game-stats span {
            font-weight: 600;
        }
        .game-stats .score {
            color: var(--success);
        }
        .game-stats .miss {
            color: var(--danger);
        }
        .btn-reset-game {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0.2rem 0.4rem;
            border-radius: 50%;
            transition: background 0.2s;
        }
        .btn-reset-game:hover {
            background: var(--border-color);
        }

        /* Board - 2 cột */
        .game-board {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 0.2rem;
        }
        .column {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 0.8rem 0.6rem;
            min-height: 340px;
            max-height: 500px;
            overflow-y: auto;
            border: 2px solid var(--border-color);
            transition: background 0.3s, border 0.3s;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .column-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--text-secondary);
            text-align: center;
            padding-bottom: 0.3rem;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 0.2rem;
            letter-spacing: 0.5px;
        }
        .card-item {
            padding: 0.55rem 0.8rem;
            background: var(--bg-primary);
            border-radius: 12px;
            border: 2px solid transparent;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
            transition: all 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            user-select: none;
            position: relative;
            flex-shrink: 0;
            line-height: 1.3;
            word-break: break-word;
        }
        .card-item:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }
        .card-item.selected {
            border-color: var(--primary);
            background: rgba(108, 99, 255, 0.12);
            transform: scale(1.02);
        }
        .card-item.matched {
            animation: matchPop 0.5s ease forwards;
            pointer-events: none;
        }
        .card-item.wrong {
            animation: shake 0.4s ease;
            border-color: var(--danger);
        }
        .card-item.correct {
            border-color: var(--success);
            background: rgba(40, 167, 69, 0.12);
        }

        @keyframes matchPop {
            0% {
                transform: scale(1.1);
                opacity: 1;
            }
            50% {
                transform: scale(1.25);
                opacity: 0.6;
            }
            100% {
                transform: scale(0);
                opacity: 0;
            }
        }
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            20% {
                transform: translateX(-8px);
            }
            60% {
                transform: translateX(8px);
            }
        }

        /* Win overlay */
        .win-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 300;
            animation: fadeIn 0.4s ease;
        }
        .win-overlay.show {
            display: flex;
        }
        .win-box {
            background: var(--bg-card);
            padding: 2rem 1.8rem;
            border-radius: 28px;
            text-align: center;
            max-width: 340px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: popUp 0.4s ease;
        }
        .win-box i {
            font-size: 3.5rem;
            color: #ffc107;
        }
        .win-box h2 {
            margin: 0.5rem 0 0.2rem;
            font-size: 1.4rem;
        }
        .win-box p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 1.2rem;
        }
        .win-box .btn-group {
            display: flex;
            gap: 0.6rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .win-box .btn-group .btn {
            border-radius: 30px;
            padding: 0.4rem 1.2rem;
            font-size: 0.9rem;
        }
        @keyframes popUp {
            0% {
                transform: scale(0.7);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        /* Empty state */
        .empty-game {
            text-align: center;
            padding: 2rem 0.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .empty-game i {
            font-size: 3rem;
            opacity: 0.3;
            margin-bottom: 0.5rem;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0.5rem 0 0.7rem;
            background: var(--nav-bg);
            backdrop-filter: blur(16px);
            border-top: 1px solid var(--border-color);
            z-index: 200;
            transition: background var(--transition), border var(--transition);
        }
        .bottom-nav a {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.1rem;
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 0.6rem;
            transition: color 0.2s;
            padding: 0.1rem 0.6rem;
        }
        .bottom-nav a i {
            font-size: 1.4rem;
        }
        .bottom-nav a.active {
            color: var(--primary);
        }

        /* Responsive */
        @media (max-width: 640px) {
            .game-board {
                grid-template-columns: 1fr 1fr;
                gap: 0.6rem;
            }
            .column {
                padding: 0.5rem;
                min-height: 220px;
                max-height: 350px;
            }
            .card-item {
                font-size: 0.8rem;
                padding: 0.4rem 0.5rem;
                border-radius: 10px;
            }
            .game-header h1 {
                font-size: 1.1rem;
            }
            .game-stats {
                font-size: 0.75rem;
                padding: 0.2rem 0.7rem;
            }
            .bottom-nav a {
                font-size: 0.55rem;
            }
            .bottom-nav a i {
                font-size: 1.2rem;
            }
            .win-box {
                padding: 1.5rem;
            }
            .win-box h2 {
                font-size: 1.2rem;
            }
        }
        @media (max-width: 480px) {
            .game-board {
                grid-template-columns: 1fr 1fr;
                gap: 0.4rem;
            }
            .column {
                padding: 0.3rem;
                min-height: 180px;
                max-height: 280px;
            }
            .card-item {
                font-size: 0.7rem;
                padding: 0.3rem 0.4rem;
                border-radius: 8px;
            }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="game-header">
            <h1><i class="bi bi-grid-3x3-gap-fill"></i> Ghép từ</h1>
            <div class="game-stats">
                <span>✅ <span class="score" id="scoreDisplay">0</span></span>
                <span>❌ <span class="miss" id="missDisplay">0</span></span>
                <button class="btn-reset-game" onclick="resetGame()" title="Chơi lại">
                    <i class="bi bi-arrow-counterclockwise"></i>
                </button>
            </div>
        </div>

        <div class="game-board" id="gameBoard">
            <!-- Cột trái: Từ vựng -->
            <div class="column" id="leftCol">
                <div class="column-title">📝 Từ vựng</div>
            </div>
            <!-- Cột phải: Nghĩa -->
            <div class="column" id="rightCol">
                <div class="column-title">📖 Nghĩa</div>
            </div>
        </div>

        <!-- Win Overlay -->
        <div class="win-overlay" id="winOverlay">
            <div class="win-box">
                <i class="bi bi-trophy"></i>
                <h2>🎉 Chúc mừng!</h2>
                <p>Bạn đã ghép đúng tất cả!</p>
                <p style="font-size: 0.8rem;">Số lần sai: <span id="finalMiss">0</span></p>
                <div class="btn-group">
                    <button class="btn btn-success" onclick="resetGame()"><i class="bi bi-arrow-counterclockwise"></i> Chơi lại</button>
                    <a href="/" class="btn btn-outline-secondary">Trang chủ</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <a href="/"><i class="bi bi-house"></i><span>Trang chủ</span></a>
        <a href="/study"><i class="bi bi-book"></i><span>Học</span></a>
        <a href="/game" class="active"><i class="bi bi-controller"></i><span>Game</span></a>
        <a href="/calculator"><i class="bi bi-calculator"></i><span>Máy tính</span></a>
    </nav>

    <script>
        // ===== DATA =====
        const wordData = {{ words|tojson }};
        let score = 0;
        let miss = 0;
        let matchedPairs = 0;
        const totalPairs = wordData.length;

        let selectedCard = null; // Thẻ đang được chọn (từ hoặc nghĩa)

        // ===== DOM =====
        const leftCol = document.getElementById('leftCol');
        const rightCol = document.getElementById('rightCol');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const missDisplay = document.getElementById('missDisplay');
        const winOverlay = document.getElementById('winOverlay');
        const finalMiss = document.getElementById('finalMiss');

        // ===== SHUFFLE =====
        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // ===== RENDER =====
        function renderGame() {
            leftCol.innerHTML = '<div class="column-title">📝 Từ vựng</div>';
            rightCol.innerHTML = '<div class="column-title">📖 Nghĩa</div>';

            if (totalPairs === 0) {
                leftCol.innerHTML += `<div class="empty-game"><i class="bi bi-emoji-frown"></i><p>Chưa có từ nào!</p></div>`;
                rightCol.innerHTML += `<div class="empty-game"><i class="bi bi-emoji-frown"></i><p>Hãy thêm từ mới</p></div>`;
                return;
            }

            const words = wordData.map(w => ({ id: w[0], text: w[1], pairId: w[0], type: 'word' }));
            const meanings = wordData.map(w => ({ id: w[0], text: w[2], pairId: w[0], type: 'meaning' }));

            const shuffledWords = shuffle(words);
            const shuffledMeanings = shuffle(meanings);

            shuffledWords.forEach(w => {
                const card = createCard(w.text, w.pairId, w.type);
                leftCol.appendChild(card);
            });
            shuffledMeanings.forEach(m => {
                const card = createCard(m.text, m.pairId, m.type);
                rightCol.appendChild(card);
            });
        }

        function createCard(text, pairId, type) {
            const div = document.createElement('div');
            div.className = 'card-item';
            div.textContent = text;
            div.dataset.pairId = pairId;
            div.dataset.type = type;
            div.addEventListener('click', onCardClick);
            return div;
        }

        // ===== XỬ LÝ CLICK =====
        function onCardClick(e) {
            const card = e.currentTarget;

            // Nếu thẻ đã được ghép đúng hoặc đang bị khóa
            if (card.classList.contains('matched') || card.classList.contains('correct')) return;

            // Nếu chưa chọn thẻ nào
            if (!selectedCard) {
                // Chọn thẻ này
                clearSelected();
                card.classList.add('selected');
                selectedCard = card;
                return;
            }

            // Nếu click vào chính thẻ đang chọn => bỏ chọn
            if (selectedCard === card) {
                clearSelected();
                return;
            }

            // Đã có thẻ được chọn, kiểm tra ghép cặp
            const card1 = selectedCard;
            const card2 = card;

            const pairId1 = parseInt(card1.dataset.pairId);
            const pairId2 = parseInt(card2.dataset.pairId);
            const type1 = card1.dataset.type;
            const type2 = card2.dataset.type;

            // Kiểm tra cùng pairId và khác loại (1 từ + 1 nghĩa)
            if (pairId1 === pairId2 && type1 !== type2) {
                // Ghép đúng
                score++;
                matchedPairs++;
                updateStats();

                card1.classList.remove('selected');
                card1.classList.add('correct');
                card2.classList.add('correct');

                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    setTimeout(() => {
                        card1.remove();
                        card2.remove();
                        if (matchedPairs === totalPairs) {
                            showWin();
                        }
                    }, 500);
                }, 200);

                clearSelected();
            } else {
                // Ghép sai
                miss++;
                updateStats();

                card1.classList.remove('selected');
                card1.classList.add('wrong');
                card2.classList.add('wrong');

                setTimeout(() => {
                    card1.classList.remove('wrong');
                    card2.classList.remove('wrong');
                }, 400);

                clearSelected();
            }
        }

        // ===== CLEAR SELECTED =====
        function clearSelected() {
            if (selectedCard) {
                selectedCard.classList.remove('selected');
                selectedCard = null;
            }
            // Xóa class selected trên các thẻ khác (phòng trường hợp)
            document.querySelectorAll('.card-item.selected').forEach(el => el.classList.remove('selected'));
        }

        // ===== UPDATE STATS =====
        function updateStats() {
            scoreDisplay.textContent = score;
            missDisplay.textContent = miss;
        }

        // ===== WIN =====
        function showWin() {
            finalMiss.textContent = miss;
            winOverlay.classList.add('show');
        }

        // ===== RESET =====
        function resetGame() {
            score = 0;
            miss = 0;
            matchedPairs = 0;
            clearSelected();
            winOverlay.classList.remove('show');
            updateStats();
            leftCol.querySelectorAll('.card-item').forEach(el => el.remove());
            rightCol.querySelectorAll('.card-item').forEach(el => el.remove());
            renderGame();
        }

        // ===== THEME SYNC =====
        (function() {
            const html = document.documentElement;
            const saved = localStorage.getItem('theme') || 'light';
            if (saved === 'dark') html.setAttribute('data-bs-theme', 'dark');
            window.addEventListener('storage', function(e) {
                if (e.key === 'theme') {
                    html.setAttribute('data-bs-theme', e.newValue || 'light');
                }
            });
        })();

        // ===== INIT =====
        renderGame();
    </script>
</body>
</html>
