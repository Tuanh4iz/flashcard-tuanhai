<!DOCTYPE html>
<html lang="vi" data-bs-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🎮 Ghép cặp từ vựng</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        :root {
            --bg-primary: #f0f2f5;
            --bg-card: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: #6c757d;
            --shadow: 0 2px 12px rgba(0,0,0,0.06);
            --shadow-hover: 0 6px 24px rgba(0,0,0,0.12);
            --radius: 16px;
            --nav-bg: rgba(255,255,255,0.85);
            --border-color: rgba(0,0,0,0.06);
            --success: #28a745;
            --danger: #dc3545;
            --primary: #6c63ff;
        }
        [data-bs-theme="dark"] {
            --bg-primary: #12121e;
            --bg-card: #1e1e3a;
            --text-primary: #f1f1f1;
            --text-secondary: #8a8aa8;
            --shadow: 0 2px 12px rgba(0,0,0,0.3);
            --shadow-hover: 0 6px 24px rgba(0,0,0,0.5);
            --nav-bg: rgba(20,20,40,0.9);
            --border-color: rgba(255,255,255,0.06);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg-primary);
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 80px;
        }
        .game-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0.8rem 1rem 1.5rem;
        }
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .game-header h1 {
            font-size: 1.3rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .game-header h1 i { color: var(--primary); }
        .game-stats {
            display: flex;
            gap: 0.8rem;
            font-size: 0.85rem;
            background: var(--bg-card);
            padding: 0.3rem 1rem;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            align-items: center;
        }
        .game-stats .score { color: var(--success); font-weight: 700; }
        .game-stats .miss { color: var(--danger); font-weight: 700; }
        .btn-reset-game {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0.2rem 0.4rem;
        }

        .game-board {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .column {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 0.8rem 0.6rem;
            min-height: 340px;
            border: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .column-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--text-secondary);
            text-align: center;
            padding-bottom: 0.3rem;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 0.2rem;
        }
        .card-item {
            padding: 0.55rem 0.8rem;
            background: var(--bg-primary);
            border-radius: 12px;
            border: 2px solid transparent;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
            transition: all 0.2s;
            user-select: none;
            line-height: 1.3;
            word-break: break-word;
        }
        .card-item:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }
        .card-item.selected {
            border-color: var(--primary);
            background: rgba(108, 99, 255, 0.12);
        }
        .card-item.matched {
            animation: matchPop 0.5s ease forwards;
            pointer-events: none;
        }
        .card-item.wrong {
            animation: shake 0.4s ease;
            border-color: var(--danger);
        }
        .card-item.correct {
            border-color: var(--success);
            background: rgba(40, 167, 69, 0.12);
        }

        @keyframes matchPop {
            0% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .win-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 300;
        }
        .win-overlay.show { display: flex; }
        .win-box {
            background: var(--bg-card);
            padding: 2rem 1.8rem;
            border-radius: 28px;
            text-align: center;
            max-width: 340px;
            width: 90%;
        }
        .win-box i { font-size: 3.5rem; color: #ffc107; }
        .win-box h2 { margin: 0.5rem 0 0.2rem; font-size: 1.4rem; }
        .win-box p { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1.2rem; }

        .empty-game {
            text-align: center;
            padding: 2rem 0.5rem;
            color: var(--text-secondary);
        }
        .empty-game i { font-size: 3rem; opacity: 0.3; margin-bottom: 0.5rem; }

        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0.5rem 0 0.7rem;
            background: var(--nav-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--border-color);
            z-index: 200;
        }
        .bottom-nav a {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.1rem;
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 0.6rem;
            padding: 0.1rem 0.6rem;
        }
        .bottom-nav a i { font-size: 1.4rem; }
        .bottom-nav a.active { color: var(--primary); }

        @media (max-width: 640px) {
            .game-board { gap: 0.6rem; }
            .column { padding: 0.5rem; min-height: 220px; }
            .card-item { font-size: 0.8rem; padding: 0.4rem 0.5rem; }
            .game-header h1 { font-size: 1.1rem; }
            .game-stats { font-size: 0.75rem; padding: 0.2rem 0.7rem; }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="game-header">
            <h1><i class="bi bi-grid-3x3-gap-fill"></i> Ghép từ</h1>
            <div class="game-stats">
                <span>✅ <span class="score" id="scoreDisplay">0</span></span>
                <span>❌ <span class="miss" id="missDisplay">0</span></span>
                <button class="btn-reset-game" onclick="resetGame()" title="Chơi lại">
                    <i class="bi bi-arrow-counterclockwise"></i>
                </button>
            </div>
        </div>

        <div class="game-board" id="gameBoard">
            <div class="column" id="leftCol">
                <div class="column-title">📝 Từ vựng</div>
            </div>
            <div class="column" id="rightCol">
                <div class="column-title">📖 Nghĩa</div>
            </div>
        </div>

        <div class="win-overlay" id="winOverlay">
            <div class="win-box">
                <i class="bi bi-trophy"></i>
                <h2>🎉 Chúc mừng!</h2>
                <p>Bạn đã ghép đúng tất cả!</p>
                <p style="font-size: 0.8rem;">Số lần sai: <span id="finalMiss">0</span></p>
                <div style="display: flex; gap: 0.6rem; justify-content: center;">
                    <button class="btn btn-success" onclick="resetGame()">
                        <i class="bi bi-arrow-counterclockwise"></i> Chơi lại
                    </button>
                    <a href="/" class="btn btn-outline-secondary">Trang chủ</a>
                </div>
            </div>
        </div>

        <!-- ⚠️ DỮ LIỆU ĐƯỢC NHÚNG TRỰC TIẾP VÀO HTML -->
        <div id="dataContainer" style="display:none;">
            {% for w in words %}
                <div class="data-item"
                     data-id="{{ w.id }}"
                     data-word="{{ w.word }}"
                     data-meaning="{{ w.meaning }}"></div>
            {% endfor %}
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="/"><i class="bi bi-house"></i><span>Trang chủ</span></a>
        <a href="/study"><i class="bi bi-book"></i><span>Học</span></a>
        <a href="/game" class="active"><i class="bi bi-controller"></i><span>Game</span></a>
        <a href="/calculator"><i class="bi bi-calculator"></i><span>Máy tính</span></a>
    </nav>

    <script>
        // ===== ĐỌC DỮ LIỆU TỪ HTML =====
        const dataItems = document.querySelectorAll('.data-item');
        const wordData = [];
        dataItems.forEach(item => {
            wordData.push({
                id: parseInt(item.dataset.id),
                word: item.dataset.word,
                meaning: item.dataset.meaning
            });
        });

        let score = 0;
        let miss = 0;
        let matchedPairs = 0;
        const totalPairs = wordData.length;
        let selectedCard = null;

        const leftCol = document.getElementById('leftCol');
        const rightCol = document.getElementById('rightCol');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const missDisplay = document.getElementById('missDisplay');
        const winOverlay = document.getElementById('winOverlay');
        const finalMiss = document.getElementById('finalMiss');

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function renderGame() {
            leftCol.innerHTML = '<div class="column-title">📝 Từ vựng</div>';
            rightCol.innerHTML = '<div class="column-title">📖 Nghĩa</div>';

            if (totalPairs === 0) {
                leftCol.innerHTML += '<div class="empty-game"><i class="bi bi-emoji-frown"></i><p>Chưa có từ nào!</p></div>';
                rightCol.innerHTML += '<div class="empty-game"><i class="bi bi-emoji-frown"></i><p>Hãy thêm từ mới</p></div>';
                return;
            }

            const words = wordData.map(w => ({ text: w.word, pairId: w.id, type: 'word' }));
            const meanings = wordData.map(w => ({ text: w.meaning, pairId: w.id, type: 'meaning' }));

            shuffle(words).forEach(w => leftCol.appendChild(createCard(w.text, w.pairId, w.type)));
            shuffle(meanings).forEach(m => rightCol.appendChild(createCard(m.text, m.pairId, m.type)));
        }

        function createCard(text, pairId, type) {
            const div = document.createElement('div');
            div.className = 'card-item';
            div.textContent = text;
            div.dataset.pairId = pairId;
            div.dataset.type = type;
            div.addEventListener('click', onCardClick);
            return div;
        }

        function onCardClick(e) {
            const card = e.currentTarget;
            if (card.classList.contains('matched') || card.classList.contains('correct')) return;

            if (!selectedCard) {
                clearSelected();
                card.classList.add('selected');
                selectedCard = card;
                return;
            }

            if (selectedCard === card) { clearSelected(); return; }

            const c1 = selectedCard;
            const c2 = card;

            if (parseInt(c1.dataset.pairId) === parseInt(c2.dataset.pairId) && c1.dataset.type !== c2.dataset.type) {
                score++;
                matchedPairs++;
                updateStats();
                c1.classList.remove('selected');
                c1.classList.add('correct');
                c2.classList.add('correct');
                setTimeout(() => {
                    c1.classList.add('matched');
                    c2.classList.add('matched');
                    setTimeout(() => {
                        c1.remove(); c2.remove();
                        if (matchedPairs === totalPairs) showWin();
                    }, 500);
                }, 200);
                clearSelected();
            } else {
                miss++;
                updateStats();
                c1.classList.remove('selected');
                c1.classList.add('wrong');
                c2.classList.add('wrong');
                setTimeout(() => { c1.classList.remove('wrong'); c2.classList.remove('wrong'); }, 400);
                clearSelected();
            }
        }

        function clearSelected() {
            if (selectedCard) { selectedCard.classList.remove('selected'); selectedCard = null; }
            document.querySelectorAll('.card-item.selected').forEach(el => el.classList.remove('selected'));
        }

        function updateStats() {
            scoreDisplay.textContent = score;
            missDisplay.textContent = miss;
        }

        function showWin() {
            finalMiss.textContent = miss;
            winOverlay.classList.add('show');
        }

        function resetGame() {
            score = 0; miss = 0; matchedPairs = 0;
            clearSelected();
            winOverlay.classList.remove('show');
            updateStats();
            leftCol.querySelectorAll('.card-item').forEach(el => el.remove());
            rightCol.querySelectorAll('.card-item').forEach(el => el.remove());
            renderGame();
        }

        (function() {
            const html = document.documentElement;
            const saved = localStorage.getItem('theme') || 'light';
            if (saved === 'dark') html.setAttribute('data-bs-theme', 'dark');
        })();

        renderGame();
    </script>
</body>
</html>
